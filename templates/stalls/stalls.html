<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Stalls - Market Stall Management</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        h1 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .stall-card { background: #2a2a2a; margin: 12px 0; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #bb86fc; color: #121212; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .btn:hover { opacity: 0.8; }
        .back-link { display: inline-block; margin-top: 20px; color: #bb86fc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>All Market Stalls</h1>
        <div>
            {% for stall in stalls %}
                <div class="stall-card">
                    <div>
                        <strong>Stall #{{ stall.stall_number }}</strong> - {{ stall.vendor_name|default:"Unassigned" }}
                        <div style="font-size: 0.9em; color: #a0a0a0;">Category: {{ stall.category }}</div>
                    </div>
                    <a href="{% url 'stalls:dashboard' %}" class="btn">View</a>
                </div>
            {% empty %}
                <p style="color: #a0a0a0; text-align: center; padding: 20px;">No stalls found.</p>
            {% endfor %}
        </div>
        <a href="{% url 'stalls:dashboard' %}" class="back-link">&larr; Back to Dashboard</a>
    </div>
</body>
</html>

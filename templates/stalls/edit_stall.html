{% extends 'base.html' %}

{% block content %}
<div class="container py-2 mt-2" style="max-width: 650px; margin: 0 auto;">
    <div class="card shadow-sm border-0">
        <!-- Blue Header -->
        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Edit Stall</h5>
            <span class="badge bg-white text-primary rounded-pill px-3 py-2 fw-semibold">Stall #{{ stall.stall_number }}</span>
        </div>
        
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Assigned Vendor Name</label>
                    <input type="text" name="vendor_name" class="form-control" value="{{ stall.vendor_name|default:'' }}" placeholder="Enter vendor name" style="text-transform: uppercase;" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Category</label>
                    <select name="category" class="form-select" required>
                        <option value="" disabled>Select Category</option>
                        <option value="Dry Goods" {% if stall.category == "Dry Goods" %}selected{% endif %}>Dry Goods</option>
                        <option value="Fruit & Vegetables" {% if stall.category == "Fruit & Vegetables" %}selected{% endif %}>Fruit & Vegetables</option>
                        <option value="Wet Market" {% if stall.category == "Wet Market" %}selected{% endif %}>Wet Market (Fish & Meat)</option>
                        <option value="Food & Beverages" {% if stall.category == "Food & Beverages" %}selected{% endif %}>Food & Beverages</option>
                    </select>
                </div>

                <!-- Rates Breakdown Section -->
                <div class="mt-4 mb-3">
                    <label class="form-label fw-bold text-secondary">Rates Breakdown:</label>
                    <div class="table-responsive">
                        <table class="table table-bordered text-center align-middle mb-2">
                            <thead class="table-light">
                                <tr class="text-muted small">
                                    <th>Daily (₱)</th>
                                    <th>Weekly (₱)</th>
                                    <th>Monthly (₱)</th>
                                    <th>Yearly (₱)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="number" step="0.01" name="rent_rate" id="daily_rate" class="form-control text-center" value="{{ stall.rent_rate }}" oninput="calculateRates()" required></td>
                                    <td><input type="text" id="weekly_rate" class="form-control text-center bg-white" readonly></td>
                                    <td><input type="text" id="monthly_rate" class="form-control text-center bg-white" readonly></td>
                                    <td><input type="text" id="yearly_rate" class="form-control text-center bg-white" readonly></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Phone Number</label>
                    <input type="text" name="contact_number" class="form-control" value="{{ stall.contact_number|default:'' }}" placeholder="09XXXXXXXXX" required>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'stalls:stalls_vendors' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Stall</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function calculateRates() {
    let dailyInput = document.getElementById('daily_rate');
    let daily = parseFloat(dailyInput.value) || 0;
    
    document.getElementById('weekly_rate').value = (daily * 7).toFixed(2);
    document.getElementById('monthly_rate').value = (daily * 30).toFixed(2);
    document.getElementById('yearly_rate').value = (daily * 365).toFixed(2);
}

// Run on page load to populate calculated fields
window.onload = function() {
    calculateRates();
};
</script>
{% endblock %}
